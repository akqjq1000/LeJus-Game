name: Setup Godot
description: Godot 헤드리스 실행 파일(필요하면 export 템플릿까지)을 내려받고 캐시한다.

inputs:
  version:
    description: Godot 버전 (예 4.7.2)
    required: true
  templates:
    description: export 템플릿도 설치할지 여부
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux

    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64 ~/godot/godot

    - name: Add Godot to PATH
      shell: bash
      run: |
        chmod +x ~/godot/godot
        echo "$HOME/godot" >> "$GITHUB_PATH"

    - name: Cache export templates
      if: inputs.templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        key: godot-templates-${{ inputs.version }}

    - name: Download export templates
      if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        dest=~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        mkdir -p "$dest"
        curl -fsSL -o /tmp/templates.tpz \
          "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/templates
        mv /tmp/templates/templates/* "$dest"/
        rm -rf /tmp/templates /tmp/templates.tpz
